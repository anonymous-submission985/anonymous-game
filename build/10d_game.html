<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>10d-game</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
                background: #181818;
                color: #eeeeee;
            }

            * {
                box-sizing: border-box;
            }

            [hidden] {
                display: none !important;
            }

            body {
                margin: 0;
            }

            main {
                --fov-max-size: 600px;
                width: min(calc(var(--fov-max-size) + 372px), 100%);
                margin: 0 auto;
                padding: 24px;
            }

            h1,
            h2 {
                margin-top: 0;
            }

            h1 {
                margin-bottom: 8px;
            }

            .muted {
                color: #aaaaaa;
            }

            #game {
                display: grid;
                grid-template-columns: var(--fov-max-size) 300px;
                gap: 24px;
                align-items: start;
                margin-top: 24px;
            }

            #fov {
                display: block;
                width: min(100%, var(--fov-max-size));
                height: auto;
                border: 1px solid #444444;
                image-rendering: pixelated;
            }

            aside {
                width: 300px;
                max-width: 100%;
                padding: 20px;
                border-radius: 8px;
                background: #242424;
            }

            .history {
                margin: 10px 0;
            }

            .history-label {
                margin-bottom: 3px;
            }

            .history-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 72px;
                gap: 8px;
                align-items: center;
            }

            .history-plot {
                display: block;
                width: 100%;
                height: 34px;
                border: 1px solid #444444;
                background: #1d1d1d;
            }

            .history-value {
                align-self: start;
                font-variant-numeric: tabular-nums;
            }

            #inventory {
                display: flex;
                gap: 10px;
                align-items: center;
                margin: 22px 0;
            }

            #inventory-dot {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #555555;
            }

            #inventory-dot.full {
                background: #66bb6a;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 3px 0;
                text-align: left;
            }

            th {
                width: 45%;
                color: #eeeeee;
                font-weight: 600;
            }

            td {
                color: #aaaaaa;
            }

            #game.stacked {
                grid-template-columns: minmax(0, 1fr);
            }

            #game.stacked aside {
                width: min(100%, var(--fov-max-size));
            }
        </style>
    </head>
    <body>
        <main>
            <header id="game-header" hidden>
                <h1>10d-game</h1>
                <div id="game-meta" class="muted">Seed – · Tick –</div>
            </header>

            <section id="game" hidden>
                <canvas
                    id="fov"
                    width="600"
                    height="600"
                    aria-label="Agent field of view"
                ></canvas>

                <aside id="status-panel">
                    <h2>Status</h2>
                    <div class="history">
                        <div class="history-label">Reward</div>
                        <div class="history-row">
                            <canvas
                                id="reward-history"
                                class="history-plot"
                                aria-label="Cumulative reward over the last 100 ticks"
                            ></canvas>
                            <span id="reward-value" class="history-value"
                                >0.00</span
                            >
                        </div>
                    </div>

                    <div class="history">
                        <div class="history-label">Satiety</div>
                        <div class="history-row">
                            <canvas
                                id="satiety-history"
                                class="history-plot"
                                aria-label="Satiety over the last 100 ticks"
                            ></canvas>
                            <span id="satiety-value" class="history-value"
                                >+100.0</span
                            >
                        </div>
                    </div>

                    <div class="history">
                        <div class="history-label">Hydration</div>
                        <div class="history-row">
                            <canvas
                                id="hydration-history"
                                class="history-plot"
                                aria-label="Hydration over the last 100 ticks"
                            ></canvas>
                            <span id="hydration-value" class="history-value"
                                >+100.0</span
                            >
                        </div>
                    </div>

                    <div id="inventory">
                        <span id="inventory-dot" aria-hidden="true"></span>
                        <span id="inventory-text">Inventory empty</span>
                    </div>

                    <h2>Actions</h2>
                    <table>
                        <tbody>
                            <tr>
                                <th>W / ↑</th>
                                <td>Move north</td>
                            </tr>
                            <tr>
                                <th>A / ←</th>
                                <td>Move west</td>
                            </tr>
                            <tr>
                                <th>S / ↓</th>
                                <td>Move south</td>
                            </tr>
                            <tr>
                                <th>D / →</th>
                                <td>Move east</td>
                            </tr>
                            <tr>
                                <th>E</th>
                                <td>Eat bean</td>
                            </tr>
                            <tr>
                                <th>F</th>
                                <td>Pick up bean</td>
                            </tr>
                            <tr>
                                <th>R</th>
                                <td>Drop bean</td>
                            </tr>
                            <tr>
                                <th>Space</th>
                                <td>Wait</td>
                            </tr>
                            <tr>
                                <th>Q / Esc</th>
                                <td>End game</td>
                            </tr>
                        </tbody>
                    </table>
                </aside>
            </section>
        </main>

            function appendHistory(history, value) {
                history.push(value);
                if (history.length > HISTORY_LENGTH) {
                    history.shift();
                }
            }

            function drawHistory(canvasElement, values, color) {
                const width = canvasElement.clientWidth;
                const height = canvasElement.clientHeight;
                if (width === 0 || height === 0 || values.length === 0) {
                    return;
                }

                const pixelRatio = window.devicePixelRatio || 1;
                const pixelWidth = Math.round(width * pixelRatio);
                const pixelHeight = Math.round(height * pixelRatio);
                if (
                    canvasElement.width !== pixelWidth ||
                    canvasElement.height !== pixelHeight
                ) {
                    canvasElement.width = pixelWidth;
                    canvasElement.height = pixelHeight;
                }

                const plotContext = canvasElement.getContext("2d");
                plotContext.setTransform(
                    pixelRatio,
                    0,
                    0,
                    pixelRatio,
                    0,
                    0,
                );
                plotContext.clearRect(0, 0, width, height);

                let minimum = Math.min(...values);
                let maximum = Math.max(...values);
                if (minimum === maximum) {
                    minimum -= 1;
                    maximum += 1;
                }

                const verticalRange = maximum - minimum;
                const plotStart = HISTORY_POINT_RADIUS;
                const plotEnd = width - HISTORY_POINT_RADIUS;
                const usableHeight = height - 2 * HISTORY_POINT_RADIUS;
                const xStep =
                    (plotEnd - plotStart) / (HISTORY_LENGTH - 1);
                const points = values.map((value, index) => ({
                    x: plotEnd - (values.length - 1 - index) * xStep,
                    y:
                        height -
                        HISTORY_POINT_RADIUS -
                        ((value - minimum) / verticalRange) * usableHeight,
                }));

                if (points.length > 1) {
                    plotContext.beginPath();
                    plotContext.moveTo(points[0].x, points[0].y);
                    for (const point of points.slice(1)) {
                        plotContext.lineTo(point.x, point.y);
                    }
                    plotContext.lineCap = "round";
                    plotContext.lineJoin = "round";
                    plotContext.lineWidth = 1;
                    plotContext.strokeStyle = color;
                    plotContext.stroke();
                }

                const currentPoint = points.at(-1);
                plotContext.beginPath();
                plotContext.arc(
                    currentPoint.x,
                    currentPoint.y,
                    HISTORY_POINT_RADIUS,
                    0,
                    2 * Math.PI,
                );
                plotContext.fillStyle = color;
                plotContext.fill();

                return currentPoint.y;
            }

            function signedFixed(value) {
                return `${value >= 0 ? "+" : ""}${value.toFixed(1)}`;
            }

            function positionHistoryValue(element, plot, pointY) {
                const top = Math.min(
                    Math.max(pointY - element.offsetHeight / 2, 0),
                    plot.clientHeight - element.offsetHeight,
                );
                element.style.transform = `translateY(${top}px)`;
            }

            function drawHistories() {
                if (rewardHistory.length === 0) {
                    return;
                }

                rewardValue.textContent = rewardFormatter.format(
                    rewardHistory.at(-1),
                );
                satietyValue.textContent = signedFixed(satietyHistory.at(-1));
                hydrationValue.textContent = signedFixed(
                    hydrationHistory.at(-1),
                );

                const rewardY = drawHistory(
                    rewardPlot,
                    rewardHistory,
                    REWARD_COLOR,
                );
                const satietyY = drawHistory(
                    satietyPlot,
                    satietyHistory,
                    SATIETY_COLOR,
                );
                const hydrationY = drawHistory(
                    hydrationPlot,
                    hydrationHistory,
                    HYDRATION_COLOR,
                );
                positionHistoryValue(rewardValue, rewardPlot, rewardY);
                positionHistoryValue(satietyValue, satietyPlot, satietyY);
                positionHistoryValue(
                    hydrationValue,
                    hydrationPlot,
                    hydrationY,
                );
            }

            function updateLayout() {
                if (twoColumnWidth === 0) {
                    return;
                }

                const appStyle = getComputedStyle(app);
                const availableWidth =
                    app.clientWidth -
                    Number.parseFloat(appStyle.paddingLeft) -
                    Number.parseFloat(appStyle.paddingRight);
                gameView.classList.toggle(
                    "stacked",
                    availableWidth < twoColumnWidth,
                );
            }

            function matchFovToStatusPanel() {
                gameView.classList.remove("stacked");
                const panelBounds = statusPanel.getBoundingClientRect();
                const gap = Number.parseFloat(
                    getComputedStyle(gameView).columnGap,
                );
                const fovMaxSize = panelBounds.height;
                twoColumnWidth = fovMaxSize + panelBounds.width + gap;
                app.style.setProperty("--fov-max-size", `${fovMaxSize}px`);
                updateLayout();
            }

            function setFillColor(color) {
                context.fillStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
            }

            function drawFov() {
                const pixelCount = fovSize * fovSize;
                const redPointer = engine.xdgame_get_fov_r(game) >>> 0;
                const greenPointer = engine.xdgame_get_fov_g(game) >>> 0;
                const bluePointer = engine.xdgame_get_fov_b(game) >>> 0;
                const red = new Uint8Array(
                    engine.memory.buffer,
                    redPointer,
                    pixelCount,
                );
                const green = new Uint8Array(
                    engine.memory.buffer,
                    greenPointer,
                    pixelCount,
                );
                const blue = new Uint8Array(
                    engine.memory.buffer,
                    bluePointer,
                    pixelCount,
                );

                context.clearRect(0, 0, canvas.width, canvas.height);

                for (let screenY = 0; screenY < fovSize; screenY += 1) {
                    const sourceY = fovSize - screenY - 1;
                    const top = Math.floor(
                        (screenY * canvas.height) / fovSize,
                    );
                    const bottom = Math.floor(
                        ((screenY + 1) * canvas.height) / fovSize,
                    );
                    for (let x = 0; x < fovSize; x += 1) {
                        const source = sourceY * fovSize + x;
                        const left = Math.floor((x * canvas.width) / fovSize);
                        const right = Math.floor(
                            ((x + 1) * canvas.width) / fovSize,
                        );
                        if (red[source] === 0 && green[source] === 0) {
                            const illumination = blue[source];
                            context.fillStyle = `rgb(${illumination}, ${illumination}, ${illumination})`;
                            context.fillRect(
                                left,
                                top,
                                right - left,
                                bottom - top,
                            );
                        } else {
                            setFillColor(PLASMA[red[source]]);
                            context.fillRect(
                                left,
                                top,
                                right - left,
                                bottom - top,
                            );

                            setFillColor(PLASMA[green[source]]);
                            context.beginPath();
                            context.moveTo(right, top);
                            context.lineTo(right, bottom);
                            context.lineTo(left, bottom);
                            context.closePath();
                            context.fill();
                        }
                    }
                }

                context.lineWidth = CELL_BORDER_WIDTH;
                context.strokeStyle = BEAN_BORDER_COLOR;
                for (let screenY = 0; screenY < fovSize; screenY += 1) {
                    const sourceY = fovSize - screenY - 1;
                    const top = Math.floor(
                        (screenY * canvas.height) / fovSize,
                    );
                    const bottom = Math.floor(
                        ((screenY + 1) * canvas.height) / fovSize,
                    );
                    for (let x = 0; x < fovSize; x += 1) {
                        const source = sourceY * fovSize + x;
                        if (red[source] === 0 && green[source] === 0) {
                            continue;
                        }

                        const left = Math.floor((x * canvas.width) / fovSize);
                        const right = Math.floor(
                            ((x + 1) * canvas.width) / fovSize,
                        );
                        context.strokeRect(
                            left + 1,
                            top + 1,
                            right - left - 2,
                            bottom - top - 2,
                        );
                    }
                }

                const cellSize = canvas.width / fovSize;
                const center = Math.floor(fovSize / 2) * cellSize;
                context.strokeStyle = AGENT_BORDER_COLOR;
                context.strokeRect(
                    center + 1,
                    center + 1,
                    cellSize - 2,
                    cellSize - 2,
                );
            }

            function updateState() {
                gameMeta.textContent = `Seed ${seed} · Tick ${tick}`;
                drawHistories();

                const hasBean = engine.xdgame_get_inventory_count(game) !== 0;
                inventoryDot.classList.toggle("full", hasBean);
                inventoryText.textContent = hasBean
                    ? "Bean carried"
                    : "Inventory empty";
                drawFov();
            }

            function performAction(action) {
                if (game === 0) {
                    return;
                }
                cumulativeReward += engine.xdgame_tick(game, action);
                appendHistory(rewardHistory, cumulativeReward);
                appendHistory(
                    satietyHistory,
                    engine.xdgame_get_satiety_level(game),
                );
                appendHistory(
                    hydrationHistory,
                    engine.xdgame_get_hydration_level(game),
                );
                tick += 1;
                updateState();
            }

            function endGame() {
                clearHeldKeys();
                if (game !== 0) {
                    engine.xdgame_free_game(game);
                    game = 0;
                }
                gameView.hidden = true;
                gameMeta.textContent =
                    `Game ended · Seed ${seed} · Tick ${tick} · Reload to restart`;
            }

            function startGame(requestedSeed) {
                let config = engine.xdgame_default_config();
                if (config === 0) {
                    throw new Error(
                        "Could not allocate the default configuration.",
                    );
                }

                try {
                    game = engine.xdgame_new_game(requestedSeed, config);
                } finally {
                    engine.xdgame_free_config(config);
                }

                if (game === 0) {
                    throw new Error("Could not create the game.");
                }

                seed = requestedSeed;
                tick = 0;
                cumulativeReward = 0;
                fovSize = engine.xdgame_fov_size();
                rewardHistory.length = 0;
                satietyHistory.length = 0;
                hydrationHistory.length = 0;
                appendHistory(rewardHistory, cumulativeReward);
                appendHistory(
                    satietyHistory,
                    engine.xdgame_get_satiety_level(game),
                );
                appendHistory(
                    hydrationHistory,
                    engine.xdgame_get_hydration_level(game),
                );

                gameHeader.hidden = false;
                gameView.hidden = false;
                matchFovToStatusPanel();
                updateState();
                canvas.focus();
            }

            function beginRepeat(key, action) {
                const held = { timeout: 0, interval: 0 };
                held.timeout = setTimeout(() => {
                    performAction(action);
                    held.interval = setInterval(
                        () => performAction(action),
                        REPEAT_INTERVAL_MS,
                    );
                }, REPEAT_DELAY_MS);
                heldKeys.set(key, held);
            }

            document.addEventListener("keydown", (event) => {
                if (
                    game === 0 ||
                    event.ctrlKey ||
                    event.metaKey ||
                    event.altKey
                ) {
                    return;
                }

                const key = normalizedKey(event);
                if (key === "Escape" || key === "q") {
                    event.preventDefault();
                    endGame();
                    return;
                }

                const action = KEY_ACTIONS.get(key);
                if (action === undefined) {
                    return;
                }

                event.preventDefault();
                if (event.repeat || heldKeys.has(key)) {
                    return;
                }

                performAction(action);
                if (REPEATABLE_KEYS.has(key)) {
                    beginRepeat(key, action);
                }
            });

            document.addEventListener("keyup", (event) =>
                clearHeldKey(normalizedKey(event)),
            );
            window.addEventListener("blur", clearHeldKeys);
            window.addEventListener("resize", () => {
                updateLayout();
                drawHistories();
            });
            window.addEventListener("beforeunload", () => {
                if (game !== 0) {
                    engine.xdgame_free_game(game);
                }
            });

            async function initialize() {
                try {
                    const requestedSeed = seedFromUrl();
                    const base64 = document
                        .querySelector("#wasm-bytes")
                        .textContent.trim();
                    const binary = atob(base64);
                    const bytes = Uint8Array.from(binary, (character) =>
                        character.charCodeAt(0),
                    );
                    const result = await WebAssembly.instantiate(bytes, {});
                    engine = result.instance.exports;
                    engine._initialize();
                    startGame(requestedSeed);
                } catch (error) {
                    gameHeader.hidden = false;
                    gameMeta.textContent = `Could not start the game: ${error}`;
                }
            }

            initialize();
        </script>
    </body>
</html>
